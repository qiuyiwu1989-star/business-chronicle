# nginx 配置 · 商业通鉴 shangye.qiuyiwu.com
# 落地路径: 项目内 deploy/nginx-shangye.qiuyiwu.com.conf
# 安装路径: 服务器 /etc/nginx/sites-available/shangye.qiuyiwu.com
# 启用:   sudo ln -sf /etc/nginx/sites-available/shangye.qiuyiwu.com /etc/nginx/sites-enabled/
# 测试:   sudo nginx -t
# 重载:   sudo systemctl reload nginx
# TLS:    sudo certbot --nginx -d shangye.qiuyiwu.com --non-interactive --agree-tos -m hi@qiuyiwu.com --redirect

server {
    listen 80;
    listen [::]:80;
    server_name shangye.qiuyiwu.com;

    root /var/www/shangye.qiuyiwu.com;
    index index.html;

    # SPA fallback：所有非文件路径都回 index.html（让前端 hash router / history router 接管）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源加缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }


    # Service Worker 必须不被缓存，否则更新推不下去
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # LLM / 爬虫抓取用的纯文本内容导出
    location ~* \.(txt|xml|webmanifest)$ {
        add_header Cache-Control "public, max-age=3600";
        charset utf-8;
        types { text/plain txt; application/xml xml; application/manifest+json webmanifest; }
        default_type text/plain;
    }

    # 安全 headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # CSP —— 按项目需要扩展 connect-src / script-src / img-src
    # 放行：Google Fonts（字体）+ 百度统计；worker-src 供 PWA Service Worker
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://hm.baidu.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://hm.baidu.com; worker-src 'self'; manifest-src 'self';" always;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml application/manifest+json image/svg+xml;
    gzip_min_length 256;

    server_tokens off;

    access_log /var/log/nginx/shangye.qiuyiwu.com.access.log;
    error_log  /var/log/nginx/shangye.qiuyiwu.com.error.log;
}
